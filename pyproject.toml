[project]
name = "online-cinema-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Andrii Bilenko",email = "olimp_72@ukr.net"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "stripe (>=15.6.1,<16.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "bcrypt (<4.0.0)"
]

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "flake8 (>=7.4.1,<8.0.0)"
]
